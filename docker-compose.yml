# Local MySQL for development: `docker compose up -d`
# Credentials match the defaults in backend/src/main/resources/application.yml.
services:
  mysql:
    image: mysql:8.4
    container_name: group-matcher-mysql
    environment:
      MYSQL_DATABASE: group_matcher
      MYSQL_USER: group_matcher
      MYSQL_PASSWORD: group_matcher
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
